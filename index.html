<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Web Craft 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: auto;
            z-index: 10;
            max-width: 250px;
        }
        #ui-overlay h3 { margin: 0 0 8px 0; color: #4caf50; }
        .control-row { margin-bottom: 5px; }
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 8px;
            gap: 8px;
            z-index: 10;
        }
        .slot {
            width: 45px;
            height: 45px;
            border: 3px solid #555;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
        }
        .slot.active {
            border-color: #fff;
            box-shadow: 0 0 10px #fff;
        }
        #action-modes {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .mode-btn {
            background: #222;
            color: white;
            border: 2px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active {
            background: #4caf50;
            border-color: #fff;
        }
    </style>
    <!-- Fallback stable CDN link for Three.js -->
    <script src="https://unpkg.com"></script>
    <!-- Orbit Controls tool so you can drag to look around without lock bugs -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ui-overlay">
        <h3>Web Craft 3D</h3>
        <div class="control-row"><b>Look around:</b> Left Click & Drag screen</div>
        <div class="control-row"><b>Interact:</b> Double-click a block</div>
        <div class="control-row"><b>Change blocks:</b> Tap numeric keys 1-4</div>
        <button onclick="clearSave()" style="margin-top:10px; background:#f44336; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Reset Map</button>
    </div>

    <div id="action-modes">
        <button id="btn-build" class="mode-btn active" onclick="setMode(true)">BUILD MODE</button>
        <button id="btn-break" class="mode-btn" onclick="setMode(false)">BREAK MODE</button>
    </div>

    <div id="inventory">
        <div class="slot active" data-type="1" style="background-color: #557a2b;" onclick="selectSlot(0)">1</div>
        <div class="slot" data-type="2" style="background-color: #a0764c;" onclick="selectSlot(1)">2</div>
        <div class="slot" data-type="3" style="background-color: #737373;" onclick="selectSlot(2)">3</div>
        <div class="slot" data-type="4" style="background-color: #e5c158;" onclick="selectSlot(3)">4</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer, controls;
        let activeBlockType = 1;
        let isBuildMode = true;
        const objects = [];

        const blockMaterials = {
            1: createBlockMaterial('#557a2b', '#4d6e27'), // Grass
            2: createBlockMaterial('#86603c', '#6e4e30'), // Dirt
            3: createBlockMaterial('#707070', '#5a5a5a'), // Stone
            4: createBlockMaterial('#f4cc3a', '#d4af26')  // Gold
        };
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 10, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Orbit controls remove pointer-lock glitches entirely
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(8, 2, 8);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't clip under ground

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dl = new THREE.DirectionalLight(0xffffff, 0.5);
            dl.position.set(10, 20, 10);
            scene.add(dl);

            loadWorld();

            // Handle Interactions cleanly
            window.addEventListener('dblclick', onSceneInteract);
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if(e.key >= 1 && e.key <= 4) selectSlot(e.key - 1);
            });
        }

        function createBlockMaterial(mainColor, shadowColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = mainColor; ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = shadowColor;
            for(let i=0; i<16; i+=2) {
                for(let j=0; j<16; j+=2) {
                    if(Math.random() > 0.6) ctx.fillRect(i, j, 2, 2);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: texture });
        }

        function createBlock(x, y, z, type) {
            const block = new THREE.Mesh(geometry, blockMaterials[type]);
            block.position.set(x, y, z);
            block.userData = { type: type };
            scene.add(block);
            objects.push(block);
        }

        function onSceneInteract(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (!isBuildMode) {
                    // Break block
                    scene.remove(intersect.object);
                    const index = objects.indexOf(intersect.object);
                    if (index > -1) objects.splice(index, 1);
                } else {
                    // Build block
                    const pos = new THREE.Vector3().copy(intersect.object.position).add(intersect.face.normal);
                    createBlock(pos.x, pos.y, pos.z, activeBlockType);
                }
                saveWorld();
            }
        }

        function setMode(buildMode) {
            isBuildMode = buildMode;
            document.getElementById('btn-build').classList.toggle('active', buildMode);
            document.getElementById('btn-break').classList.toggle('active', !buildMode);
        }

        function selectSlot(index) {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => s.classList.remove('active'));
            slots[index].classList.add('active');
            activeBlockType = parseInt(slots[index].getAttribute('data-type'));
        }

        function saveWorld() {
            const blockData = objects.map(obj => ({
                x: obj.position.x, y: obj.position.y, z: obj.position.z, t: obj.userData.type
            }));
            localStorage.setItem('webcraft_stable_save', JSON.stringify(blockData));
        }

        function loadWorld() {
            const saved = localStorage.getItem('webcraft_stable_save');
            if (saved) {
                JSON.parse(saved).forEach(d => createBlock(d.x, d.y, d.z, d.t));
            } else {
                // Build simple starter valley platform
                for (let x = 0; x < 16; x++) {
                    for (let z = 0; z < 16; z++) {
                        createBlock(x, 0, z, 1);
                        if(Math.random() > 0.85) createBlock(x, 1, z, 2); 
                    }
                }
                saveWorld();
            }
        }

        function clearSave() {
            localStorage.removeItem('webcraft_stable_save');
            window.location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

 animate() {requestAnimationFrame(animate);controls.update();renderer.render(scene, camera);}
